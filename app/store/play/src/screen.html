<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  body { width: 1080px; height: 1920px; position: relative; }
  .text { position: absolute; left: 96px; right: 96px; top: 120px; }
  .label { font-size: 30px; }
  h1 { margin-top: 28px; font-weight: 300; font-size: 76px; line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; }
  .rule { position: absolute; left: 96px; right: 96px; top: 452px; height: 1px; background: #44403C; }
  .phone { position: absolute; left: 50%; top: 520px; width: 640px; transform: translateX(-50%);
           border-radius: 64px; border: 2px solid #44403C; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .phone img { display: block; width: 100%; }
</style></head>
<body>
  <div class="text"><div class="label" id="label"></div><h1 id="title"></h1></div>
  <div class="rule"></div>
  <div class="phone"><img id="shot"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('label').textContent = q.get('label');
  document.getElementById('title').textContent = q.get('title');
  document.getElementById('shot').src = '../../../../website/public/screenshots/' + q.get('shot') + '.png';
</script></body></html>
