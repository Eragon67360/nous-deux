<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  body { width: 1024px; height: 500px; display: flex; align-items: center; padding: 0 96px; gap: 72px; }
  svg { flex: none; }
  h1 { font-weight: 200; font-size: 104px; letter-spacing: -.02em; line-height: 1; }
  p { margin-top: 22px; font-weight: 300; font-size: 34px; color: #D6D3D1; }
  .label { font-size: 20px; margin-bottom: 22px; }
</style></head>
<body>
  <svg width="210" height="160" viewBox="0 0 210 160" aria-hidden="true">
    <circle cx="78.8" cy="80" r="67.2" fill="none" stroke="#C4A77D" stroke-width="8.8"/>
    <circle cx="131.2" cy="80" r="67.2" fill="none" stroke="#F5F0EB" stroke-width="8.8"/>
    <circle cx="105.0" cy="80" r="14.1" fill="#FF8FA3"/>
  </svg>
  <div><div class="label" id="label"></div><h1>Nous Deux</h1><p id="tag"></p></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('label').textContent = q.get('label');
  document.getElementById('tag').textContent = q.get('tag');
</script></body></html>
