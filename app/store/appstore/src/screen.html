<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../play/src/common.css">
<style>
  /* App Store, iPhone 6.3" (the size App Store Connect asks for): 1206 × 2622. */
  body { width: 1206px; height: 2622px; position: relative; }
  .text { position: absolute; left: 104px; right: 104px; top: 170px; }
  .label { font-size: 34px; }
  h1 { margin-top: 34px; font-weight: 300; font-size: 88px; line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
  .rule { position: absolute; left: 104px; right: 104px; top: 600px; height: 1px; background: #44403C; }
  .phone { position: absolute; left: 50%; top: 680px; width: 860px; transform: translateX(-50%);
           border-radius: 88px; border: 2px solid #44403C; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,.45); }
  .phone img { display: block; width: 100%; }
</style></head>
<body>
  <div class="text"><div class="label" id="label"></div><h1 id="title"></h1></div>
  <div class="rule"></div>
  <div class="phone"><img id="shot"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('label').textContent = q.get('label');
  document.getElementById('title').textContent = q.get('title');
  document.getElementById('shot').src = '../../../../website/public/screenshots/' + q.get('shot') + '.png';
</script></body></html>
