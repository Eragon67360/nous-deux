# Nous Deux - Supabase CLI config, for local development only. The server is
# self-hosted (docs/SELF_HOSTING.md); its settings live in infra/supabase/.
[project]
id = "nous-deux"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["https://localhost:8080"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true

[auth.external.apple]
enabled = true

[auth.external.phone]
enabled = true

# Only the database calls the push functions, with a shared secret
# (PUSH_WEBHOOK_SECRET) instead of a JWT.
[functions.notify-partner-ping]
verify_jwt = false

[functions.notify-partner-period]
verify_jwt = false
