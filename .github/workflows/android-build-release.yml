name: Android Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "app/lib/**"
      - "app/android/**"
      - "app/assets/**"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - ".github/workflows/android-build-release.yml"

permissions:
  contents: write

jobs:
  build_and_release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Android Release
    runs-on: ubuntu-latest
    # The Flutter app lives in app/; `uses:` steps and step-level
    # working-directory are still relative to the repo root.
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart (for link check)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Check links
        run: dart run scripts/check_period_links.dart

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          BUILD="${GITHUB_RUN_NUMBER:-0}"
          if echo "$VERSION" | grep -q '+'; then
            FULL="${VERSION}"
          else
            FULL="${VERSION}+${BUILD}"
          fi
          echo "version=$FULL" >> $GITHUB_OUTPUT
          echo "Version: $FULL"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          # maplibre_gl compiles with Java 21 (the app itself targets 17).
          java-version: "21"

      # Pinned to the Flutter used locally: newer releases require Gradle
      # 9.3.1, and the app is on Gradle 8.14. Move both together.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.38.9"
          cache: true

      # FIXED: Changed 'working-directory' (invalid) to 'build-root-directory'
      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          build-root-directory: app/android

      - name: Create Keystore
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Provide Supabase keys file for release build
        run: cp lib/core/config/supabase_keys_stub.dart lib/core/config/supabase_keys.dart

      # 1. BUILD AAB
      - name: Build App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # GlitchTip project DSN (infra/glitchtip/). Unset, the define is
          # empty and the build reports no crashes.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        # The Google client ids are public and default in app_constants.dart;
        # passing an unset secret as a define would replace them with "".
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"

      # R8 must keep device_calendar's models under their own names: the plugin
      # sends them to Dart as JSON keyed by field name, and renamed, every phone
      # calendar arrives without an id (android/app/proguard-rules.pro).
      - name: Check R8 kept the calendar plugin's models
        run: scripts/check-r8-keeps.sh build/app/outputs/mapping/release/mapping.txt

      # 2. GENERATE APK (from the AAB created above)
      - name: Generate APK from AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar
          mkdir -p build/app/outputs/flutter-apk
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=android/upload-keystore.jks \
            --ks-pass=pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=pass:"$ANDROID_KEY_PASSWORD"
          unzip -p app.apks universal.apk > build/app/outputs/flutter-apk/app-release.apk

      # 3. RENAME FILES (Versioning)
      - name: Rename Artifacts
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          AAB_OLD="build/app/outputs/bundle/release/app-release.aab"
          AAB_NEW="build/app/outputs/bundle/release/NousDeux-App-v${VERSION}.aab"
          APK_OLD="build/app/outputs/flutter-apk/app-release.apk"
          APK_NEW="build/app/outputs/flutter-apk/NousDeux-App-v${VERSION}.apk"
          mv $AAB_OLD $AAB_NEW
          mv $APK_OLD $APK_NEW
          # Read by `uses:` steps, which run from the repo root.
          echo "aab_path=app/$AAB_NEW" >> $GITHUB_OUTPUT
          echo "apk_path=app/$APK_NEW" >> $GITHUB_OUTPUT

      # 4. CREATE GITHUB RELEASE (Happens BEFORE Play Store upload)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android/v${{ steps.version.outputs.version }}"
          name: "Android v${{ steps.version.outputs.version }}"
          files: |
            ${{ steps.rename.outputs.aab_path }}
            ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true

      - name: Find Mapping File
        run: find . -name "mapping.txt"
        id: mapping

      # 5. UPLOAD TO PLAY STORE (Happens Last)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.nousdeux.android
          # Note: We use the renamed path from the previous step
          releaseFiles: ${{ steps.rename.outputs.aab_path }}
          # mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: draft
          # Committing this edit also sends every change waiting in the Play
          # Console for review (it did on 2026-11-15). Play refuses
          # changesNotSentForReview for this app ("Changes are sent for
          # review automatically"), so leave nothing half-done in the
          # Console before releasing to main.

      # Older builds offer this one on their update screen
      # (docs/UPDATE_SCREEN.md). A refusal only warns: the build is out
      # either way.
      - name: Tell older builds about this one
        if: success()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: ../scripts/record-build.sh android
